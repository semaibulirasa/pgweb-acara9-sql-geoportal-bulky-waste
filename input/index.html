<!DOCTYPE html>
<html>
<head>
    <title>Form Input Drop Off Bulky Waste, Jakarta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 40px; text-align: center; }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #000080; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 12px; margin-bottom: 5px; text-align: center; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #000080;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        input[type="submit"]:hover { background-color: #000055; }
        #informasi { color: red; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Input Drop Off Bulky Waste</h2>

    <form action="input.php" onsubmit="return validateForm()" method="post">
        <label for="nama_object">Nama Object:</label>
        <input type="text" id="nama_object" name="nama_object" placeholder="Contoh: Dipo RW 005">

        <label for="alamat">Alamat:</label>
        <input type="text" id="alamat" name="alamat" placeholder="Contoh: Jl. Inspeksi Kali Sunter">

        <label for="lat">Y (Latitude):</label>
        <input type="text" id="lat" name="latitude" placeholder="Contoh: -6.1719494">

        <label for="long">X (Longitude):</label>
        <input type="text" id="long" name="longitude" placeholder="Contoh: 106.89055379">

        <label for="kelurahan">WADMKD (Kelurahan):</label>
        <input type="text" id="kelurahan" name="kelurahan" placeholder="Contoh: Kelapa Gading Barat">

        <label for="kecamatan">WADMKC (Kecamatan):</label>
        <input type="text" id="kecamatan" name="kecamatan" placeholder="Contoh: Kelapa Gading">

        <label for="kota">WADMKK (Kota):</label>
        <input type="text" id="kota" name="kota" placeholder="Contoh: Kota Adm. Jakarta Utara">

        <input type="submit" value="Simpan Data">
    </form>

    <p id="informasi"></p>
</div>

<script>
function validateForm() {
    let lat = document.getElementById("lat").value;
    let long = document.getElementById("long").value;
    if (isNaN(lat) || isNaN(long) || lat === "" || long === "") {
        document.getElementById("informasi").innerHTML = "Koordinat Y (Latitude) dan X (Longitude) harus berupa angka valid";
        event.preventDefault();
        return false;
    }
}
</script>

</body>
</html>
